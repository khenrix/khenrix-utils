# khenrix-utils — LLM-agnostic source of truth
#
# Declares the capabilities every configured CLI should have: MCP servers,
# skills, base instructions and baseline settings.
#
# The per-CLI `khenrix-setup` reconcile skill reads this file, compares it
# against the live config of whichever CLI it runs inside, and applies ONLY the
# additions/updates declared here. It never deletes entries it does not own —
# machine-specific extras are always preserved.
#
# Format note: TOML (not YAML) so Python's stdlib `tomllib` can read it with
# zero install on any machine. Secrets are NEVER inlined — use ${HOME}/env refs.
# `${HOME}` and `${VAR}` are expanded by the reconcile script at apply time.

version = 1

# Retained source/evidence only. These exact skills and their bound libraries are
# excluded from active discovery, optional plugin output, and native delivery.
[historical_only]
skills = ["llm-council", "llm-forge"]
libraries = ["council", "forge"]

# ---------------------------------------------------------------------------
# MCP servers — portable across all three CLIs unless a gate narrows them.
# `platform` (linux|darwin|windows) gates an entry to matching OSes.
# `clis` (a subset of claude|codex|agy) gates an entry to the CLIs whose MCP client can
#   actually run it — same allow-list shape as `platform`, different question. Omit it for
#   the normal case (every CLI). An unknown name is refused, not guessed (reconcile.py
#   mcp_clis); withholding here does NOT remove a server already live — see google-drive.
# `transport` is http (url) or stdio (command/args/env).
# ---------------------------------------------------------------------------
[mcp_servers.context7]
transport = "http"
url = "https://mcp.context7.com/mcp"

# vercel was REMOVED 2026-08-13: replaced by the Vercel CLI (`vercel`), which holds a
# durable token instead of an hour-long OAuth access token with NO refresh_token — the MCP
# had to redo a browser login every hour, and did it through a BROWSER shim that did not
# exist, so it sat "Failed to connect — CONNECTION_CLOSED" through a whole autonomous run.
# It was already withheld from agy for hanging its client (160 s timeout with the entry
# live, 7 s without). Removing the declaration is a NO-OP for live configs — reconcile.py
# is additive-only — so the entries were deleted from ~/.claude.json, ~/.codex/config.toml
# and ~/.gemini/config/mcp_config.json by hand, and the stale mcp-auth token cache dropped.

# google-drive was REMOVED 2026-07-20: redundant with the native claude.ai Drive
# MCP, and its command hardcoded an asdf node path that the mise migration deletes.
# Removing the declaration alone is a NO-OP -- reconcile.py is additive-only and
# prints `EXTRA ... left untouched`. The live config needed explicit removal too.

# The Windows-side bridge, restored 2026-08-13 over the WSL-native variant (8f7d289,
# 2026-07-17) it replaced: a WSL-side "Chrome for Testing" keeps its OWN profile, so every
# site the agent touches wants a fresh login and the user cannot hand it a session it is
# already signed into. Driving the real Windows Chrome gives the agent the tabs, cookies
# and logins that are already there. The cost is a Windows-side Node dependency, which the
# WSL-native variant did not have. npx is resolved via `Get-Command npx.cmd` rather than a
# hardcoded `C:\Program Files\nodejs` — a per-user or winget Node does not land there and
# the server died at spawn with no diagnosable message. `bootstrap-tier0.sh` provisions the
# shim and `doctor.py` checks the prerequisite.
[mcp_servers.chrome-devtools]
platform = "windows"   # Windows Chrome + existing user profile, reached from WSL via interop
transport = "stdio"
# Chrome 144+ can expose its running normal profile to local automation without
# launching a second browser. Enable it once in the real Windows Chrome at
# chrome://inspect/#remote-debugging; --autoConnect then reuses its tabs, cookies
# and logins. Windows-side Node is required because discovery is local to Chrome.
command = "${HOME}/.local/bin/powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''
$n = (Get-Command npx.cmd -EA SilentlyContinue).Source
if (-not $n) { $n = "$env:ProgramFiles\nodejs\npx.cmd" }
if (-not (Test-Path $n)) { Write-Error "Windows-side Node/npx not found; winget install OpenJS.NodeJS.LTS"; exit 1 }
& $n -y chrome-devtools-mcp@latest --autoConnect''']
[mcp_servers.chrome-devtools.env]
CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1"

# 1Password's local MCP is shipped by the Windows desktop app. On WSL, launch it through
# the existing PowerShell interop shim so every CLI talks to the same user-approved app.
# This MCP manages Developer Environments; it never returns vault item secrets.
[mcp_servers.1password]
platform = "windows"
transport = "stdio"
command = "${HOME}/.local/bin/powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", '''& "$env:LOCALAPPDATA\Microsoft\WindowsApps\1password-mcp.exe"''']

# LinkedIn — portable, no secret in config; auth is an interactive per-machine login via the tool.
# (Slack is deliberately NOT managed here: its XOXC/XOXD are per-machine, session-scoped, rotating
# tokens that don't belong in a shared source of truth — add it by hand per machine.)
[mcp_servers.linkedin]
transport = "stdio"
command = "uvx"
args = ["mcp-server-linkedin@latest"]
[mcp_servers.linkedin.env]
UV_HTTP_TIMEOUT = "300"

# Provider-specific docs MCP. Only the matching CLI gets it; omit a provider to
# add nothing (Claude and agy have no official docs server today).
[docs_mcp.codex]
name = "openaiDeveloperDocs"
transport = "http"
url = "https://developers.openai.com/mcp"

# ---------------------------------------------------------------------------
# Approved model IDs per provider — the single registry the model-consistency
# lint (scripts/lib/checks.py) cross-checks fanout.py's MODES against. This is a
# CONSISTENCY check (every MODES model is registered), NOT a freshness check —
# keeping models current is khenrix-upgrade's job. Values are the literal source
# strings; agy's is a display label that fanout.py passes verbatim to `--model`
# (the ~/.gemini settings file is only a provenance fallback). Superseded ids stay
# listed as manual rollback candidates so a seat can be reverted without re-registering
# — the lint never re-probes them, so being listed here is not a liveness claim.
# ---------------------------------------------------------------------------
[models]
last_reviewed = "2026-09-23"
claude = ["claude-opus-5-5", "claude-fable-5-1", "claude-opus-5", "claude-fable-5", "claude-sonnet-5", "claude-opus-4-8", "claude-sonnet-4-6", "claude-haiku-4-5"]
codex  = ["gpt-6.1-sol", "gpt-6-sol", "gpt-5.6-sol", "gpt-5.5"]
agy    = ["Gemini 3.8 Flash (High)", "Gemini 3.7 Flash (High)", "Gemini 3.6 Flash (High)", "Gemini 3.5 Flash (High)"]  # rollback is manual — FALLBACK_MODELS in engine.py has no agy key, so older Flash labels are explicit rollback candidates, not automatic runtime fallbacks.

# ---------------------------------------------------------------------------
# Skills — plugin-delivered canonical bodies live in shared/skills/<name>/ and are
# rendered into each plugin by scripts/render.py. Native direct-copy skills are named
# separately under [skill_delivery]; the Superpowers bundle lives under
# shared/superpowers/ so the plugin renderer never creates a duplicate copy.
# `khenrix-setup`, `khenrix-upgrade`, and
# `khenrix-audit` are per-CLI: their shared body lives in
# shared/skill-templates/<name>/SKILL.md.tmpl and render.py fills the provider-specific
# facts from [skill_facts.<name>.<cli>] at the bottom of this file. Edit the template
# (shared prose) or the facts (provider-specific values) — never the rendered
# marketplaces/.../SKILL.md.
# ---------------------------------------------------------------------------
[[skills]]
name = "khenrix-setup"
per_cli = true

[[skills]]
name = "khenrix-upgrade"
per_cli = true

[[skills]]
name = "khenrix-audit"
per_cli = true

# Historical source identity; [historical_only] excludes active discovery/delivery.
[[skills]]
name = "llm-council"

# Wiki ingestion skills — shared bodies in shared/skills/, both driving the bundled
# `wikisync` stdlib engine (shared/lib/wikisync/ → each plugin's lib/). wiki-add ingests
# one item; wiki-sync batch-reconciles bookmarks + Instagram saves. Listed for
# discoverability; render.py globs shared/skills/.
[[skills]]
name = "khenrix-wiki-add"

[[skills]]
name = "khenrix-wiki-sync"

# Historical source identity; [historical_only] excludes active discovery/delivery.
[[skills]]
name = "llm-forge"

[[skills]]
name = "llm-fanout-plan"

[[skills]]
name = "llm-fanout-execute"

[[skills]]
name = "khenrix-quality"

[[skills]]
name = "khenrix-writing"

# Selective direct-copy delivery. These public skills are intentionally not
# installed through the Khenrix marketplace: skillctl copies only these named
# directories into the native shared skill roots and owns no sibling.
[skill_delivery]
skills = [
  "khenrix-quality",
  "khenrix-writing",
  "llm-fanout-plan",
  "llm-fanout-execute",
  "brainstorming",
  "diagnosing-superpowers",
  "dispatching-parallel-agents",
  "executing-plans",
  "finishing-a-development-branch",
  "receiving-code-review",
  "requesting-code-review",
  "subagent-driven-development",
  "systematic-debugging",
  "test-driven-development",
  "using-git-worktrees",
  "using-superpowers",
  "verification-before-completion",
  "writing-plans",
  "writing-skills",
]
source_roots = ["shared/skills", "shared/superpowers"]
state_dir = "${HOME}/.local/state/khenrix-utils/skills"
instruction_source = "house-style.md"

# Optional per-skill tables map an installed-skill relative path to one
# repository relative source directory or regular file. The composite tree is delivered and
# verified as one skill.
[skill_delivery.skill_bundles]

[skill_delivery.skill_bundles.llm-fanout-plan]
