# Anthropic list-price estimate in USD per million tokens, not the amount billed
# by Vertex or another provider. cache_write is the 5-minute write rate.
# The three token buckets (input / cache_read / cache_creation) are mutually exclusive.
# last_reviewed is bumped by khenrix-upgrade when the model lineup or pricing changes.
last_reviewed = "2026-09-23"

# price() matches exact IDs or their date-suffixed deployment variants. Unknown
# versions price at $0, so keep every CLAUDE id in capabilities.toml [models]
# listed and let the exact-ID coverage check stop missing rows. Only Claude IDs:
# the one consumer, `claude_session_stats.py`, walks
# ~/.claude/projects, so a codex or agy model never reaches `price()` — and listing them
# here would invite maintaining rates this repo has no reader for. Codex and agy bill on
# their own accounts and report their own usage.
