# Per-model price in USD per MILLION tokens. cache_write ≈ 1.25× input; cache_read is cheap.
# The three token buckets (input / cache_read / cache_creation) are mutually exclusive.
# last_reviewed is bumped by khenrix-upgrade when the model lineup or pricing changes.
last_reviewed = "2026-08-08"

# price() matches the LONGEST key that prefixes the model id — and "claude-opus-4-8"
# does NOT prefix "claude-opus-5", so a missing entry here silently prices a model at
# $0 rather than approximating it. Keep every CLAUDE id in capabilities.toml [models]
# listed. Only claude ids: the one consumer, `claude_session_stats.py`, walks
# ~/.claude/projects, so a codex or agy model never reaches `price()` — and listing them
# here would invite maintaining rates this repo has no reader for. Codex and agy bill on
# their own accounts and report their own usage.
[claude-opus-5]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25

[claude-fable-5]
input = 10.0
output = 50.0
cache_read = 1.0
cache_write = 12.5

# Standard rate; an introductory $2.00/$10.00 ran through 2026-08-31.
[claude-sonnet-5]
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

[claude-opus-4-8]
input = 5.0
output = 25.0
cache_read = 0.5
cache_write = 6.25

[claude-sonnet-4-6]
input = 3.0
output = 15.0
cache_read = 0.3
cache_write = 3.75

[claude-haiku-4-5]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 1.25
